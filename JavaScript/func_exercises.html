<html>

<head>
    <title>Exercises on Functions</title>
</head>

<body>
    <h1>Functions Exercises</h1>
    <button onclick="alert('functions')">Click me</button>
</body>
<script>
    function square(a) {
        result = a * a;
        return result;
    }

    console.log(square(10));



    function largestOfThree(a, b, c) {
        if (a > b) {
            if (a > c) {
                return a;
            }
        } else if (b > c) {
            if (b > a) {
                return b;
            }
        } else {
            return c;
        }
    }

    big = largestOfThree(30, 100, 110);
    console.log(big, 'is the largest');


    function evenOrOdd(a) {
        if (a % 2 == 0) {
            console.log("Even");
        } else {
            console.log("Odd");
        }
    }

    evenOrOdd(9);

    fact = 1;
    function factorial(f) {
        while (f != 1) {
            fact = fact * f;
            f--;
        }
        return fact;

    }

    result = factorial(4);
    console.log(result);

    function totalMarks(a, b, c, d, e) {
        total = a + b + c + d + e;
        average = total / 5;
        console.log("total marks is", total);
        console.log("avg marks is", average);
    }

    totalMarks(10, 20, 30, 40, 50);


    // 1. default
    function greet(name = "guest") {
        console.log("hello " + name);
    }

    greet()

    // 2. rest parameters
    function add(...marks) {
        console.log(marks);
    }

    add(10, 20, 30);

    //arrow fn
    // function greet() {
    //     console.log("hello world!");

    // }
    // greet();

    const greetAgain = () => {
        console.log("hello WORLD!!");
    };

    greetAgain();

    const squared = (n) => {
        return n * n;
    }; console.log(squared(10));

    const Add = (a, b) => {
        return a + b;
    }; console.log(Add(10, 20));

    // arrow function with arrays/map/advanced python:


    let numbers = [10, 20, 30, 40, 50];

    result = numbers.map((n) => {
        return n * 2;
    }); console.log(result);


    // filter

    numbers = [10, 15, 20, 25, 30, 35];
    result = numbers.filter((n) => {
        return n % 2 === 0;
    });
    console.log(result);

    // array


    let students = ['anu', 'ammu', 'meenu'];
    console.log(students);
    //array methods
    //1. push-- add one element to end

    let fruits = ['apple', 'mango'];
    fruits.push('banana');
    console.log(fruits);

    // 2.unshift()
    // add words in the beginning

    fruits.unshift("guava");
    console.log(fruits);


    // 3.pop() - remove last element

    fruits.pop();
    console.log(fruits);

    // 4.shift() - remove first element

    fruits.shift();
    console.log(fruits);

    // -------array methods contd.
    fruits = ["apple", "mango", "orange"];
    console.log(fruits.indexOf('mango'));
    console.log(fruits.reverse('mango'));
    console.log(fruits.sort());

    students = ["anu", "ammu", "meera", "arun", "abhi"];
    let a = students.slice(1, 3);
    console.log(a);

    let b = students.splice(1, 1);
    console.log(b);

    console.log(students);

    let c = students.splice(1, 0, "akhil");
    console.log(students);

    // 1.

    let fruit = ["apple", "banana", "pear", "orange"];
    fruit.push("mango");
    console.log(fruit);

    // 2.

    let student = ["amina", "sherene", "rakhi", "tod", "joe"];
    student.shift();
    console.log(student);
    student.unshift("anu");
    console.log(student);

    //3.
    let number = [1, 2, 3, 4, 5, 6];
    let x = number.slice(1, 4);
    console.log(x);

    let y = number.splice(2, 1);

    console.log(number);

    //4.
    let color = ["red", "green", "blue", "violet", "yellow"];
    console.log(color.indexOf("blue"));
    console.log(color.reverse());

    //5.
    let nums = [45, 12, 89, 23, 5, 67];
    let num = nums.sort((a, b) => a - b);//ascending sorting
    console.log(num);
    num = nums.sort((a, b) => b - a);//descending sorting
    console.log(num);


</script>
