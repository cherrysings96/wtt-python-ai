<html>

<head>
    <h1>Loops</h1>
</head>

<body>
    <button onclick="alert('Hello')">Click me</button>
</body>
<script>
    for (let i = 0; i <= 5; i++) {
        console.log(i);
    }

    for (i = 10; i >= 1; i--) {
        console.log(i);
    }
    i = 0;
    while (i <= 5) {
        console.log(i);
        i++;
    }



    //from here

    for (i = 1; i <= 20; i++) {
        console.log(i);

    }

    for (i = 0; i <= 50; i += 2) {
        console.log(i);

    }
    let j;
    for (i = 1, j = 1; i <= 7, j <= 10; i++, j++) {
        console.log(i, "*", j, "=", i * j);
        console.log("\n");
    }

    let a = 1;
    while (a <= 15) {
        console.log(a);
        a++;
    }
    let sum = 0;
    a = 10;

    while (a > 0) {
        sum += a;
        a--;
    }

    console.log(sum);
</script>

</html>
