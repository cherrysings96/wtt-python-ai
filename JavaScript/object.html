<html lang="en">

<head>
    <title>Exercises on Object</title>
</head>

<body>
    <h1>Object Exercises</h1>
    <h1 id="title">Hello</h1>



<script>
    let heading = document.getElementById("title");

    // objects

    student.email = "amina@gmail.com";
    console.log(student);
</script>
