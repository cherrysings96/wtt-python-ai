<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Swiggy 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light site-navbar">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand fw-bold" href="home.html"><span class="brand-mark">S</span>Swiggy 2.0</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="mycart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="track.html">Track</a></li>
                    <li class="nav-item"><a class="nav-link" href="previous.html">Previous</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Account</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="narrow-shell">
        <section class="panel-card p-5 text-center">
            <span class="kicker">Order confirmed</span>
            <h1 class="mt-2">Your food is on the way.</h1>
            <p class="text-muted">Estimated delivery time: 30-40 minutes.</p>
            <div id="confirmedItems" class="order-summary text-start my-4"></div>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a id="trackLink" class="btn btn-success">Track order</a>
                <a href="home.html#categories" class="btn btn-outline-warning">Order more</a>
            </div>
        </section>
    </main>

    <script>
        const cart = JSON.parse(localStorage.getItem("swiggyCart") || "[]");
        const confirmedItems = document.getElementById("confirmedItems");
        const deliveryFee = cart.length ? 35 : 0;
        const itemTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const order = {
            items: cart,
            itemTotal,
            deliveryFee,
            grandTotal: itemTotal + deliveryFee,
            placedAt: Date.now(),
            deliveryMinutes: 40
        };

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        if (cart.length) {
            const history = JSON.parse(localStorage.getItem("swiggyOrderHistory") || "[]");
            const completedOrder = {
                ...order,
                id: Date.now().toString(),
                status: "Confirmed"
            };

            localStorage.setItem("swiggyLastOrder", JSON.stringify(order));
            localStorage.setItem("swiggyOrderHistory", JSON.stringify([completedOrder, ...history].slice(0, 20)));
            localStorage.removeItem("swiggyCart");
        }

        const lastOrder = cart.length ? order : JSON.parse(localStorage.getItem("swiggyLastOrder") || "null");

        if (lastOrder && lastOrder.items.length) {
            confirmedItems.innerHTML = lastOrder.items.map((item) => `
                <div class="summary-line"><span>${escapeHtml(item.food)} x ${item.quantity}</span><strong>Rs. ${item.price * item.quantity}</strong></div>
            `).join("") + `
                <div class="summary-line"><span>Delivery fee</span><strong>Rs. ${lastOrder.deliveryFee}</strong></div>
                <div class="summary-line"><span>Grand total</span><strong>Rs. ${lastOrder.grandTotal}</strong></div>
            `;
        } else {
            confirmedItems.innerHTML = `<div class="summary-line"><span>No confirmed order yet</span><strong>Rs. 0</strong></div>`;
        }

        document.getElementById("trackLink").href = "track.html";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
