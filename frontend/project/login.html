<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Swiggy 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login-wrap">
        <section class="login-art" aria-label="Fresh restaurant food"></section>
        <section class="login-panel">
            <a class="navbar-brand fw-bold mb-4 text-decoration-none" href="home.html"><span class="brand-mark">S</span>Swiggy 2.0</a>
            <span class="kicker">Welcome back</span>
            <h1 class="mt-2">Sign in to continue ordering.</h1>
            <p class="text-muted">This demo login takes you straight into the food ordering flow.</p>

            <form action="home.html" class="panel-card p-4 mt-3">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="email">Email address</label>
                    <input id="email" type="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="password">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100">Sign in</button>
                <p class="text-center text-muted mt-3 mb-0">New here? <a href="home.html" class="text-brand fw-bold text-decoration-none">Browse as guest</a></p>
            </form>
        </section>
    </main>
</body>

</html>
