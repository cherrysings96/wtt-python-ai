<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Swiggy 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light site-navbar">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand fw-bold" href="home.html"><span class="brand-mark">S</span>Swiggy 2.0</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="mycart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="track.html">Track</a></li>
                    <li class="nav-item"><a class="nav-link" href="previous.html">Previous</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Account</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="narrow-shell">
        <header class="page-heading mb-4">
            <span class="kicker">Checkout step 1</span>
            <h1>Place your order.</h1>
            <p>Review the selected restaurant, choose quantity, and add delivery details before moving to cart.</p>
        </header>

        <section class="panel-card p-4">
            <form id="orderForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="restaurant">Restaurant</label>
                        <input type="text" id="restaurant" name="restaurant" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="food">Food item</label>
                        <input type="text" id="food" name="food" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="price">Price per item</label>
                        <input type="number" id="price" name="price" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="quantity">Quantity</label>
                        <input type="number" id="quantity" name="quantity" min="1" value="1" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold" for="address">Delivery address</label>
                        <textarea id="address" name="address" class="form-control" rows="3" placeholder="House number, street, city" required></textarea>
                    </div>
                    <div class="col-12">
                        <div class="order-summary mb-3">
                            <div class="summary-line"><span>Current total</span><strong id="liveTotal">Rs. 0</strong></div>
                            <div class="summary-line"><span>Estimated delivery</span><strong>30-40 mins</strong></div>
                        </div>
                    </div>
                    <div class="col-12 d-grid">
                        <button type="submit" class="btn btn-warning">Add to cart</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderForm = document.getElementById("orderForm");
        const restaurantInput = document.getElementById("restaurant");
        const foodInput = document.getElementById("food");
        const priceInput = document.getElementById("price");
        const quantityInput = document.getElementById("quantity");
        const addressInput = document.getElementById("address");
        const liveTotal = document.getElementById("liveTotal");

        restaurantInput.value = params.get("restaurant") || "Selected Restaurant";
        foodInput.value = params.get("food") || "Selected Food";
        priceInput.value = params.get("price") || "200";

        function updateTotal() {
            const total = Number(priceInput.value || 0) * Number(quantityInput.value || 1);
            liveTotal.textContent = "Rs. " + total;
        }

        quantityInput.addEventListener("input", updateTotal);
        orderForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const cart = JSON.parse(localStorage.getItem("swiggyCart") || "[]");
            const item = {
                id: Date.now().toString(),
                restaurant: restaurantInput.value,
                food: foodInput.value,
                price: Number(priceInput.value),
                quantity: Number(quantityInput.value),
                address: addressInput.value.trim() || "Address not provided"
            };
            const existingItem = cart.find((cartItem) =>
                cartItem.restaurant === item.restaurant &&
                cartItem.food === item.food &&
                cartItem.price === item.price &&
                cartItem.address === item.address
            );

            if (existingItem) {
                existingItem.quantity += item.quantity;
            } else {
                cart.push(item);
            }

            localStorage.setItem("swiggyCart", JSON.stringify(cart));
            window.location.href = "mycart.html";
        });
        updateTotal();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
